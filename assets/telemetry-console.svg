<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Seyid Berat Ergün — Engineering Telemetry</title><desc id="desc">Static conceptual console of AI, security, algorithms and software quality workflows. No live data, numerical metrics or operational status claims.</desc><defs><linearGradient id="accent"><stop stop-color="#5BFFED"/><stop offset=".45" stop-color="#2563EB"/><stop offset="1" stop-color="#2A9FFF"/></linearGradient><radialGradient id="halo"><stop stop-color="#2A9FFF" stop-opacity=".18"/><stop offset="1" stop-color="#2A9FFF" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#B3C3DF" stroke-opacity=".06"/></pattern><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#F0F5FF}.mono{font-family:Consolas,'Liberation Mono',monospace}.muted{fill:#B3C3DF}.cyan{fill:#5BFFED}.violet{fill:#9ADEFF}</style></defs><rect width="1200" height="370" rx="20" fill="#0A1020"/><rect width="1200" height="370" rx="20" fill="url(#grid)"/><ellipse cx="1020" cy="185" rx="340" ry="220" fill="url(#halo)"/><rect x="1" y="1" width="1198" height="368" rx="19" stroke="#28324A" fill="none"/><path d="M24 1H1176" stroke="url(#accent)" stroke-width="2"/><text x="32" y="36" font-size="12" class="mono violet" >CONSOLE / 02</text><text x="32" y="77" font-size="27" class="" font-weight="600">Engineering telemetry</text><text x="1168" y="36" font-size="12" class="mono muted" text-anchor="end">STATIC / CONCEPTUAL</text><rect x="32" y="110" width="356" height="85" rx="10" fill="#121B32" stroke="#28324A"/><circle cx="52" cy="133" r="4" fill="#5BFFED"/><text x="67" y="138" font-size="16" class="mono" >AI / EVALUATE</text><text x="50" y="170" font-size="16" class="muted" >ML Eval Studio · RAG Workbench</text><rect x="406" y="110" width="356" height="85" rx="10" fill="#121B32" stroke="#28324A"/><circle cx="426" cy="133" r="4" fill="#9ADEFF"/><text x="441" y="138" font-size="16" class="mono" >SECURITY / REVIEW</text><text x="424" y="170" font-size="16" class="muted" >Guardrail rules · API policies</text><rect x="32" y="213" width="356" height="85" rx="10" fill="#121B32" stroke="#28324A"/><circle cx="52" cy="236" r="4" fill="#5BFFED"/><text x="67" y="241" font-size="16" class="mono" >ALGORITHMS / REASON</text><text x="50" y="273" font-size="16" class="muted" >Graphs · deterministic fixtures</text><rect x="406" y="213" width="356" height="85" rx="10" fill="#121B32" stroke="#28324A"/><circle cx="426" cy="236" r="4" fill="#9ADEFF"/><text x="441" y="241" font-size="16" class="mono" >QUALITY / VERIFY</text><text x="424" y="273" font-size="16" class="muted" >Jest · regression · device QA</text><rect x="800" y="110" width="368" height="188" rx="12" fill="#121B32" stroke="#194D70"/><text x="822" y="141" font-size="14" class="mono violet" >WORKFLOW / FEEDBACK LOOP</text><g fill="none" stroke="url(#accent)" stroke-width="2"><path d="M828 184H888L922 215H979L1014 176H1137"/><path d="M828 249H901L938 183H982L1020 235H1137" opacity=".6"/></g><g fill="#5BFFED"><circle cx="888" cy="184" r="4"/><circle cx="979" cy="215" r="4"/></g><g fill="#2A9FFF"><circle cx="938" cy="183" r="4"/><circle cx="1020" cy="235" r="4"/></g><text x="822" y="279" font-size="14" class="mono muted" >QUESTION → TEST → LEARN → ITERATE</text><path d="M32 323H1168" stroke="#28324A"/><text x="32" y="348" font-size="13" class="mono cyan" >$ build → validate → harden → document</text><text x="1168" y="348" font-size="12" class="mono muted" text-anchor="end">WORKFLOWS, NOT LIVE METRICS</text></svg>
