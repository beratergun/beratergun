<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">Engineering System Matrix</title><desc id="desc">Four connected disciplines: AI evaluation, cybersecurity, algorithms and reliable software. Conceptual engineering focus map, not proficiency scores.</desc><defs><linearGradient id="accent"><stop stop-color="#00E5D4"/><stop offset=".45" stop-color="#2563EB"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient><radialGradient id="halo"><stop stop-color="#8B5CF6" stop-opacity=".18"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#94A3B8" stroke-opacity=".06"/></pattern><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#EAF2FF}.mono{font-family:Consolas,'Liberation Mono',monospace}.muted{fill:#94A3B8}.cyan{fill:#00E5D4}.violet{fill:#A78BFA}</style></defs><rect width="1200" height="400" rx="20" fill="#080C14"/><rect width="1200" height="400" rx="20" fill="url(#grid)"/><ellipse cx="1020" cy="200" rx="340" ry="220" fill="url(#halo)"/><rect x="1" y="1" width="1198" height="398" rx="19" stroke="#28324A" fill="none"/><path d="M24 1H1176" stroke="url(#accent)" stroke-width="2"/><text x="32" y="36" font-size="12" class="mono violet" >ARCHITECTURE / 01</text><text x="32" y="73" font-size="27" class="" font-weight="600">Intelligence meets secure engineering.</text><g fill="none" stroke="url(#accent)" stroke-width="2"><path d="M370 160H430L525 215M830 160H770L675 215M370 295H430L525 245M830 295H770L675 245"/><ellipse cx="600" cy="230" rx="155" ry="114" opacity=".25" stroke-dasharray="3 9"/><circle cx="600" cy="230" r="79" fill="#0D1424"/><circle cx="600" cy="230" r="66" opacity=".3"/></g><rect x="40" y="115" width="330" height="88" rx="12" fill="#0D1424" stroke="#00E5D4" stroke-opacity=".65"/><path d="M58 136V181" stroke="#00E5D4" stroke-width="3"/><text x="75" y="150" font-size="21" class="" font-weight="600">AI SYSTEMS</text><text x="75" y="178" font-size="16" class="muted" >Model · retrieve · evaluate</text><rect x="830" y="115" width="330" height="88" rx="12" fill="#0D1424" stroke="#8B5CF6" stroke-opacity=".65"/><path d="M848 136V181" stroke="#8B5CF6" stroke-width="3"/><text x="865" y="150" font-size="21" class="" font-weight="600">CYBERSECURITY</text><text x="865" y="178" font-size="16" class="muted" >Trust boundaries · secure design</text><rect x="40" y="251" width="330" height="88" rx="12" fill="#0D1424" stroke="#00E5D4" stroke-opacity=".65"/><path d="M58 272V317" stroke="#00E5D4" stroke-width="3"/><text x="75" y="286" font-size="21" class="" font-weight="600">ALGORITHMS</text><text x="75" y="314" font-size="16" class="muted" >Graphs · complexity · trade-offs</text><rect x="830" y="251" width="330" height="88" rx="12" fill="#0D1424" stroke="#A78BFA" stroke-opacity=".65"/><path d="M848 272V317" stroke="#A78BFA" stroke-width="3"/><text x="865" y="286" font-size="21" class="" font-weight="600">RELIABLE SOFTWARE</text><text x="865" y="314" font-size="16" class="muted" >APIs · regression · device QA</text><text x="600" y="222" font-size="19" class="mono" text-anchor="middle" font-weight="700">ENGINEERING</text><text x="600" y="248" font-size="16" class="mono cyan" text-anchor="middle">BUILD / VERIFY</text><circle cx="430" cy="160" r="4" fill="#00E5D4"/><circle cx="770" cy="295" r="4" fill="#8B5CF6"/><text x="40" y="374" font-size="13" class="mono muted" >CONCEPTUAL FOCUS MAP</text><text x="1160" y="374" font-size="13" class="mono violet" text-anchor="end">DESIGN → BUILD → VALIDATE → HARDEN</text></svg>
