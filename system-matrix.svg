<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Engineering focus system matrix</title>
  <desc id="desc">Animated diagram connecting artificial intelligence, cybersecurity, algorithms, and software engineering.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060914"/>
      <stop offset="0.5" stop-color="#091527"/>
      <stop offset="1" stop-color="#070815"/>
    </linearGradient>
    <linearGradient id="edge" x1="250" y1="70" x2="960" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5D4"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 216) rotate(90) scale(118)">
      <stop stop-color="#0B2940"/>
      <stop offset="1" stop-color="#07101E"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#4A7892" fill-opacity="0.16"/></pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .orbit { transform-origin:600px 216px; animation: orbit 18s linear infinite; }
      .orbitR { transform-origin:600px 216px; animation: orbitR 25s linear infinite; }
      .pulse { animation:pulse 2.8s ease-in-out infinite; transform-origin:center; }
      .pulse2 { animation:pulse 3.5s ease-in-out infinite .5s; transform-origin:center; }
      .flow { stroke-dasharray:7 11; animation:flow 5s linear infinite; }
      .flowR { stroke-dasharray:5 10; animation:flowR 6s linear infinite; }
      @keyframes orbit { to { transform:rotate(360deg); } }
      @keyframes orbitR { to { transform:rotate(-360deg); } }
      @keyframes pulse { 0%,100%{opacity:.45;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)} }
      @keyframes flow { to{stroke-dashoffset:-150} }
      @keyframes flowR { to{stroke-dashoffset:150} }
    </style>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="24" fill="url(#dots)"/>
  <rect x="20" y="20" width="1160" height="390" rx="20" stroke="#26384C"/>
  <text x="54" y="62" fill="#6F879D" font-size="14" class="mono">SYSTEM_MATRIX / INTERSECTION_MAP / v2026.08</text>
  <text x="54" y="92" fill="#E2E8F0" font-size="26" font-weight="750">Engineering focus: intelligence × security × performance</text>

  <path class="flow" d="M330 143C420 110 480 145 535 188" stroke="#00F5D4" stroke-width="2" opacity="0.75"/>
  <path class="flowR" d="M870 143C780 110 720 145 665 188" stroke="#8B5CF6" stroke-width="2" opacity="0.75"/>
  <path class="flowR" d="M330 302C420 333 483 293 536 245" stroke="#22D3EE" stroke-width="2" opacity="0.75"/>
  <path class="flow" d="M870 302C780 333 717 293 664 245" stroke="#A78BFA" stroke-width="2" opacity="0.75"/>

  <g class="orbit" opacity="0.45"><ellipse cx="600" cy="216" rx="165" ry="112" stroke="#00F5D4" stroke-dasharray="3 12"/><circle cx="765" cy="216" r="5" fill="#00F5D4" filter="url(#glow)"/></g>
  <g class="orbitR" opacity="0.42"><ellipse cx="600" cy="216" rx="210" ry="148" stroke="#8B5CF6" stroke-dasharray="2 15"/><circle cx="390" cy="216" r="5" fill="#8B5CF6" filter="url(#glow)"/></g>

  <g class="pulse">
    <rect x="84" y="112" width="265" height="89" rx="15" fill="#071522" stroke="#00F5D4" stroke-opacity="0.65"/>
    <circle cx="118" cy="143" r="10" fill="#00F5D4" filter="url(#glow)"/>
    <text x="143" y="149" fill="#F1F5F9" font-size="20" font-weight="700">AI SYSTEMS</text>
    <text x="107" y="180" fill="#7F96AA" font-size="13" class="mono">LLMs • Flask • data-driven apps</text>
  </g>

  <g class="pulse2">
    <rect x="851" y="112" width="265" height="89" rx="15" fill="#0C1020" stroke="#8B5CF6" stroke-opacity="0.7"/>
    <circle cx="885" cy="143" r="10" fill="#8B5CF6" filter="url(#glow)"/>
    <text x="910" y="149" fill="#F1F5F9" font-size="20" font-weight="700">CYBERSECURITY</text>
    <text x="875" y="180" fill="#8793B4" font-size="13" class="mono">secure design • threat awareness</text>
  </g>

  <g class="pulse2">
    <rect x="84" y="262" width="265" height="89" rx="15" fill="#071522" stroke="#22D3EE" stroke-opacity="0.65"/>
    <circle cx="118" cy="293" r="10" fill="#22D3EE" filter="url(#glow)"/>
    <text x="143" y="299" fill="#F1F5F9" font-size="20" font-weight="700">ALGORITHMS</text>
    <text x="107" y="330" fill="#7F96AA" font-size="13" class="mono">complexity • graphs • optimization</text>
  </g>

  <g class="pulse">
    <rect x="851" y="262" width="265" height="89" rx="15" fill="#0C1020" stroke="#A78BFA" stroke-opacity="0.7"/>
    <circle cx="885" cy="293" r="10" fill="#A78BFA" filter="url(#glow)"/>
    <text x="910" y="299" fill="#F1F5F9" font-size="20" font-weight="700">SOFTWARE</text>
    <text x="875" y="330" fill="#8793B4" font-size="13" class="mono">architecture • APIs • reliability</text>
  </g>

  <circle cx="600" cy="216" r="104" fill="url(#core)" stroke="url(#edge)" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="600" cy="216" r="78" stroke="#2A5B70" stroke-dasharray="4 9"/>
  <path d="M571 216L592 237L632 195" stroke="#00F5D4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="273" text-anchor="middle" fill="#F8FAFC" font-size="17" font-weight="700" class="mono">SECURE ENGINEERING</text>
  <text x="600" y="294" text-anchor="middle" fill="#6F879D" font-size="12" class="mono">BUILD • TEST • HARDEN</text>
</svg>
